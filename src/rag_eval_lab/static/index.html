<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Eval Lab</title>
<style>
  :root { --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --accent: #0b57d0; --bg: #fff; --card: #f5f5f7; --warn: #a15c00; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --accent: #8ab4f8; --bg: #161617; --card: #232325; --warn: #f0b354; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input { flex: 1 1 320px; padding: 10px 12px; font: inherit; color: inherit; background: var(--bg);
          border: 1px solid var(--line); border-radius: 8px; }
  button { padding: 10px 16px; font: inherit; border: 1px solid var(--accent); border-radius: 8px;
           background: var(--accent); color: var(--bg); cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); }
  section { margin-top: 24px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  .answer { padding: 14px 16px; background: var(--card); border-radius: 10px; white-space: pre-wrap; }
  .refused { color: var(--warn); }
  .meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .hit { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; }
  .hit.cited { border-color: var(--accent); }
  .hit header { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; }
  .hit code { color: var(--accent); }
  .hit pre { white-space: pre-wrap; word-break: break-word; margin: 8px 0 0; font-size: 13px; max-height: 220px; overflow: auto; }
  a.cite { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>RAG Eval Lab</h1>
  <p class="sub">Ask a question about the Model Context Protocol documentation.</p>
  <form id="form">
    <input id="q" name="q" placeholder="How does a client cancel an in-flight request over stdio?" required>
    <button type="submit">Ask</button>
    <button type="button" class="secondary" id="search">Search only</button>
  </form>
  <section id="answer-section" hidden>
    <h2>Answer</h2>
    <div id="answer" class="answer"></div>
    <div id="answer-meta" class="meta"></div>
  </section>
  <section id="hits-section" hidden>
    <h2>Retrieved chunks</h2>
    <div id="hits"></div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function renderHits(hits, cited = []) {
    $("hits").innerHTML = hits.map((h, i) => `
      <article class="hit ${cited.includes(h.chunk_id) ? "cited" : ""}" id="${escapeHtml(h.chunk_id)}">
        <header>
          <span>#${i + 1} <code>${escapeHtml(h.chunk_id)}</code></span>
          <span>score ${h.score.toFixed(4)}</span>
        </header>
        <div class="meta">${escapeHtml(h.heading_path.join(" > "))}</div>
        <pre>${escapeHtml(h.text)}</pre>
      </article>`).join("");
    $("hits-section").hidden = false;
  }

  function renderAnswer(data) {
    // Turn [chunk_id] citations into links to the chunk cards below.
    const linked = escapeHtml(data.answer).replace(/\[([^\[\]\s]+#[fh]\d{3,})\]/g,
      (_, id) => `<a class="cite" href="#${id}">[${id}]</a>`);
    $("answer").innerHTML = linked;
    $("answer").classList.toggle("refused", data.refused);
    $("answer-meta").textContent =
      `config ${data.config} · provider ${data.provider} · confidence ${data.confidence.toFixed(2)}` +
      (data.refused ? " · refused" : ` · ${data.citations.length} citation(s)`);
    $("answer-section").hidden = false;
  }

  $("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const response = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: $("q").value }),
    });
    const data = await response.json();
    renderAnswer(data);
    renderHits(data.hits, data.citations);
  });

  $("search").addEventListener("click", async () => {
    if (!$("q").value) return;
    const response = await fetch(`/search?q=${encodeURIComponent($("q").value)}&k=10`);
    const data = await response.json();
    $("answer-section").hidden = true;
    renderHits(data.hits);
  });
</script>
</body>
</html>
