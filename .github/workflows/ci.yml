name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Mock mode everywhere: no API keys are used in CI.
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/rag_eval_lab/models.py') }}

      - name: Cache corpus embeddings
        uses: actions/cache@v4
        with:
          path: .cache/embeddings
          key: emb-${{ hashFiles('data/corpus/**', 'src/rag_eval_lab/corpus.py', 'src/rag_eval_lab/chunking.py') }}

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,neural,live]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck
        run: mypy

      - name: Tests
        run: pytest -q

      - name: Evals (mock mode)
        run: python -m evals.run_eval --output-dir eval-output

      - name: Regression gate (recall@5 within 3 points of baseline)
        run: python -m evals.check_regression --results eval-output/results.json

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-output/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rag-eval-lab .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 -e RAG_CONFIG=heading/bm25 --name app rag-eval-lab
          for i in $(seq 1 30); do curl -sf localhost:8000/ > /dev/null && break; sleep 2; done
          curl -sf "localhost:8000/search?q=stdio&k=3"
